<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priora | {{title or 'Task Management Application'}}</title>
    <meta
      name="description"
      content="{{ description or 'A task manager application made with Flask, Python, and SQLite' }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css' )}}"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='media/favicon.ico' )}}"
    />
    <meta name="theme-color" content="#94B9FF" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=sunny"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div class="flash-container">
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message.upper() }}</div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}
    <header>{% include 'header.html' %}</header>
    <main>{% block content %}{% endblock content %}</main>
    <footer>{% include 'footer.html' %}</footer>
    <script
      src="{{ url_for('static', filename='js/script.js' )}}"
      defer
    ></script>
  </body>
</html>
