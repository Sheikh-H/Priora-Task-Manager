{% extends 'layout.html' %} {% block content %}
<section class="register-login-section">
  <div class="form-left hidden-left">
    <h1 class="gradient-text">Password Reset</h1>
    <p>
      <i>Enter your email address and memorable info to reset your password</i>
    </p>
  </div>
  <div class="form-right hidden-right">
    <h2>Forgotten Password?</h2>
    <form action="/reset-password" method="post" id="memorable-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="input-box">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#1f1f1f"
        >
          <path
            d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480v58q0 59-40.5 100.5T740-280q-35 0-66-15t-52-43q-29 29-65.5 43.5T480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480v58q0 26 17 44t43 18q26 0 43-18t17-44v-58q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93h200v80H480Zm85-315q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Z"
          />
        </svg>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email"
          value="{{request.form.get('email', '')}}"
          required
        />
      </div>
      <div class="input-box">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#1f1f1f"
        >
          <path
            d="M420-360h120l-23-129q20-10 31.5-29t11.5-42q0-33-23.5-56.5T480-640q-33 0-56.5 23.5T400-560q0 23 11.5 42t31.5 29l-23 129Zm60 280q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z"
          />
        </svg>
        <input
          type="password"
          name="memorable-info"
          id="memorable-info"
          placeholder="Memorable info"
          value="{{ request.form.get('memorable-info', '') }}"
          required
        />
      </div>
      <div><p class="form-error"></p></div>
      <button type="submit">Reset password</button>
    </form>
  </div>
</section>
{% endblock content %}
