{% extends 'layout.html' %} {% block content %}
<section class="register-login-section">
  <div class="form-left hidden-left">
    <h1 class="gradient-text">Existing User?</h1>
    <p><i>Transform your task management experience</i></p>
  </div>
  <div class="form-right hidden-right">
    <h2>Login</h2>
    <form action="/login" method="post" id="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="input-box">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#1f1f1f"
        >
          <path
            d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480v58q0 59-40.5 100.5T740-280q-35 0-66-15t-52-43q-29 29-65.5 43.5T480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480v58q0 26 17 44t43 18q26 0 43-18t17-44v-58q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93h200v80H480Zm85-315q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Z"
          />
        </svg>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email"
          value="{{request.form.get('email', '')}}"
          required
        />
      </div>
      <div class="input-box">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#1f1f1f"
        >
          <path
            d="M240-640h360v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85h-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640Zm0 480h480v-400H240v400Zm296.5-143.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM240-160v-400 400Z"
          />
        </svg>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Password"
          value="{{ request.form.get('password', '') }}"
          required
        />
      </div>
      <div><p class="form-error"></p></div>
      <button type="submit">Sign In</button>
    </form>
    <p>
      Don't have an account?
      <a href="{{ url_for('register') }}">Sign up here!</a>
    </p>
  </div>
</section>
{% endblock content %}
