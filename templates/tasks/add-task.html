{% extends 'layout.html' %} {% block content %}
<section class="add-task-section">
  <div class="task-input-view">
    <form action="{{ url_for('add_task')}}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <p>Add a new task:</p>
      <div class="task-input-view-box">
        <p>Title:</p>
        <input type="text" name="title" id="title" />
      </div>
      <p>Description</p>
      <textarea name="description" id="description" rows="5"></textarea>
      <p>Due:</p>
      <div class="task-input-due">
        <input type="date" name="due-date" id="due-date" min="{{today}}" />
        <input type="time" name="due-time" id="due-time" />
      </div>
      <button type="submit">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#1f1f1f"
        >
          <path
            d="M480-46q-90 0-169-34t-138-93q-59-59-93-138T46-480q0-90 34-169t93-138q59-59 138-93t169-34q38 0 76 6.5t74 19.5q23 8 30.5 33t-6.5 47q-14 23-40.5 31t-52.5 0q-20-5-40.5-8t-40.5-3q-128 0-218 90t-90 218q0 128 90 218t218 90q14 0 26.5-1.5T532-177q27-5 52.5 5.5T622-137q11 23 1.5 47T590-60q-27 7-54.5 10.5T480-46Zm257-211h-57q-26 0-44.5-18.5T617-320q0-26 18.5-44.5T680-383h57v-57q0-26 18.5-44.5T800-503q26 0 44.5 18.5T863-440v57h57q26 0 44.5 18.5T983-320q0 26-18.5 44.5T920-257h-57v57q0 26-18.5 44.5T800-137q-26 0-44.5-18.5T737-200v-57ZM421-443l367-368q17-17 42-17t42 17q17 17 17 42t-17 42L466-321q-19 19-45 19t-45-19l-99-99q-17-17-17-41.5t17-41.5q17-17 42-17t42 17l60 60Z"
          />
        </svg>
        Add Task
      </button>
    </form>
  </div>
</section>

{% endblock content %}
