{% extends 'layout.html' %} {% block content %}
<section class="user-home-section">
  <h1>Welcome!</h1>
  <div class="user-home-main">
    <div>
      <aside>
        <nav>
          <ul>
            <li>New Task</li>
            <li>Completed Tasks</li>
          </ul>
        </nav>
      </aside>
    </div>
    <div class="user-home-tasks-grid">
      <form action="" method="post">
        <div class="user-home-tasks-card">
          <div>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <input type="hidden" name="task-id" value="{{ csrf_token() }}" />
            <!-- change to task id ^ -->
            <input type="checkbox" name="task-completed" id="task-completed" />
            <p>Task title task title task</p>
            <!-- count: 25 -->
          </div>
          <p class="show-on-tablet show-on-desktop">task description</p>
          <p>24/07/26 15:00 PM</p>
        </div>
      </form>

      <!-- <div><p>Add your first task!</p></div> -->
      <!--  -->
      <!-- <div><p>All up to date, add some new tasks!</p></div> -->
    </div>
  </div>
</section>
{% endblock content %}
