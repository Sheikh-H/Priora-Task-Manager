{% extends 'layout.html' %} {% block content %}
<section class="task-view-section">
  <div class="task-view">
    <form action="/user/task/<int:task_id>" method="post">
      <input type="text" name="title" id="title" value="{{ task['title'] }}" />
      <input
        type="text"
        name="description"
        id="description"
        value="{{ task['description'] }}"
      />
      <input
        type="date"
        name="due-date"
        id="due-date"
        value="{{ task['due_date'] }}"
      />
      <input
        type="time"
        name="due-time"
        id="due-time"
        value="{{ task['due_time'] }}"
      />
      <input
        type="date"
        name="completed-date"
        id="completed-date"
        value="{{ task['completion_date'] }}"
      />
      <input
        type="time"
        name="completed-time"
        id="completed-time"
        value="{{ task['completion_time'] }}"
      />

      {% if task['completed'] == 0 %}
      <div class="button-section">
        <div class="task-view-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#1f1f1f"
          >
            <path
              d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q48 0 93.5 11t87.5 32q15 8 19.5 24t-5.5 30q-10 14-26.5 18t-32.5-4q-32-15-66.5-23t-69.5-8q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-8-.5-15.5T798-511q-2-17 6.5-32.5T830-564q16-5 30 3t16 24q2 14 3 28t1 29q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm-56-328 372-373q11-11 27.5-11.5T852-781q11 11 11 28t-11 28L452-324q-12 12-28 12t-28-12L282-438q-11-11-11-28t11-28q11-11 28-11t28 11l86 86Z"
            />
          </svg>

          <p>Mark as complete</p>
        </div>
      </div>
      {% else %}
      <div class="task-view-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="20px"
          viewBox="0 -960 960 960"
          width="20px"
          fill="#000000"
        >
          <path
            d="M522-176q0 26-17 43.5T463-116q-9 1-18 1.5t-18 .5q-52-6-100-27.5T238-200q-44-40-73.5-90.5T123-401q-6-24 4.5-45t34.5-27q24-6 45.5 5t27.5 35q8 42 30 79.5t54 65.5q25 22 52.5 36t58.5 19h17q9 0 17-2 23 3 40.5 19t17.5 40Zm224-3-28 29q-18 18-41 16.5T636-152q-19-18-19-41.5t19-42.5l26-26-28-28q-19-19-18-42t20-42q19-19 42-19t42 19l26 28 28-28q18-18 42-17.5t42 18.5q18 18 18 41.5T858-290l-29 28 29 28q18 18 17.5 41T857-152q-18 18-41.5 18.5T774-151l-28-28ZM479-708q-50 0-94.5 17T307-641h35q18 0 31 13t13 31q0 18-13 31.5T342-552H178q-24 0-41.5-17.5T119-611v-163q0-18 13-30.5t31-12.5q18 0 30.5 12.5T206-774v72q51-58 120.5-91T479-826q73 0 137 26t114 72q32 29 56 64.5t39 76.5q8 23-2.5 44.5T789-513q-23 8-44.5-3T715-550q-11-28-29-51.5T646-644q-33-30-76-47t-91-17Zm45 222 37 38q15 15 12.5 31.5T559-388q-12 12-29.5 13.5T495-390l-41-41q-8-8-12.5-18t-4.5-23v-133q0-18 13-30.5t31-12.5q18 0 30.5 12.5T524-605v119Z"
          />
        </svg>

        <p>Mark as incomplete</p>
      </div>
      {% endif %}
    </form>
  </div>
  <div class="task-view-log">
    <div class="task-log">
      <p><strong>Task Log</strong></p>
      <hr />
      <!--  -->
      <div class="log">
        <div class="log-info">
          <p>25-05-2005</p>
          <p>15:55</p>
        </div>
        <div class="log-description">
          <p>Task updated</p>
        </div>
      </div>
      <!--  -->
      <!--  -->
      <div class="log">
        <div class="log-info">
          <p>25-05-2005</p>
          <p>15:55</p>
        </div>
        <div class="log-description">
          <p>Task added</p>
        </div>
      </div>
      <!--  -->
    </div>
  </div>
</section>

{% endblock content %}
